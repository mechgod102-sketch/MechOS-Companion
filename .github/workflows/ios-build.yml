name: iOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform projects
        run: ./scripts/bootstrap-platforms.sh

      - name: Validate source
        run: python3 scripts/validate_source.py

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build unsigned iPhone app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        run: |
          mkdir -p dist/ios/Payload
          cp -R build/ios/iphoneos/Runner.app dist/ios/Payload/MechOS\ Companion.app
          cd dist/ios
          zip -qry MechOS-Companion-v0.1.3-unsigned.zip Payload
          cd ../..

      - name: Package Xcode-ready source
        run: |
          mkdir -p dist/xcode/MechOS-Companion-v0.1.3
          cp -R ios dist/xcode/MechOS-Companion-v0.1.3/
          cp -R lib dist/xcode/MechOS-Companion-v0.1.3/
          cp -R docs dist/xcode/MechOS-Companion-v0.1.3/
          cp -R test dist/xcode/MechOS-Companion-v0.1.3/
          cp -R mechos_bridge dist/xcode/MechOS-Companion-v0.1.3/
          cp -R scripts dist/xcode/MechOS-Companion-v0.1.3/
          cp pubspec.yaml pubspec.lock analysis_options.yaml README.md CHANGELOG.md LICENSE dist/xcode/MechOS-Companion-v0.1.3/
          cat > dist/xcode/MechOS-Companion-v0.1.3/OPEN_IN_XCODE.md <<'EOF'
          # Open MechOS Companion v0.1.3 in Xcode

          1. Install Flutter and Xcode on macOS.
          2. In Terminal, open this folder.
          3. Run `flutter pub get`.
          4. Open `ios/Runner.xcworkspace` in Xcode.
          5. Select Runner > Signing & Capabilities and choose your Apple Development Team.
          6. Select an iPhone or simulator and press Run.

          Bundle identifier: `com.mechos.companion`

          The included iOS project was generated by the CI Flutter toolchain and already contains the MechOS platform patches. Apple signing material is intentionally not included.
          EOF
          cd dist/xcode
          zip -qry ../ios/MechOS-Companion-v0.1.3-Xcode-Source.zip MechOS-Companion-v0.1.3
          cd ../..

      - name: Create checksums
        run: |
          cd dist/ios
          shasum -a 256 MechOS-Companion-v0.1.3-unsigned.zip MechOS-Companion-v0.1.3-Xcode-Source.zip > SHA256SUMS.txt

      - name: Upload complete iOS build
        uses: actions/upload-artifact@v4
        with:
          name: MechOS-Companion-v0.1.3-iOS-Complete
          path: |
            dist/ios/MechOS-Companion-v0.1.3-unsigned.zip
            dist/ios/MechOS-Companion-v0.1.3-Xcode-Source.zip
            dist/ios/SHA256SUMS.txt
          if-no-files-found: error
